<div class="chart-container" *ngIf="widget?.config?.chart_type !== 'kpi'; else kpiTemplate">
  <canvas #chartCanvas></canvas>
</div>

<ng-template #kpiTemplate>
  <div class="kpi-value">
    {{ kpiValue }}
  </div>
</ng-template>

<div class="no-chart-data" *ngIf="widget?.config?.chart_type !== 'kpi' && (!widget?.chart_data || widget.chart_data.length === 0)">
  <p>No chart data available</p>
</div>
