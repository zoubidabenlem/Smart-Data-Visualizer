<div class="filter-chip-wrapper">
  <button
    mat-stroked-button
    class="filter-toggle"
    [class.active]="filters.length > 0"
    (click)="toggleOpen()">
    <mat-icon>filter_alt</mat-icon>
    Filters
    <span class="filter-badge" *ngIf="filters.length > 0">{{ filters.length }}</span>
  </button>

  <div class="chip-body" *ngIf="open">

    <div class="chip-head">
      <mat-icon class="chip-icon">info_outline</mat-icon>
      <span>Filters apply to this view only. They are not saved.</span>
      <button mat-icon-button class="chip-close" (click)="toggleOpen()" aria-label="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Active pills -->
    <div class="pill-list" *ngIf="filters.length > 0">
      <div class="filter-pill" *ngFor="let f of filters; let i = index">
        <span class="pill-text">{{ displayFilter(f) }}</span>
        <button class="pill-x" (click)="remove(i)" aria-label="Remove">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <button class="clear-all" (click)="clear()">Clear all</button>
    </div>

    <!-- Add form -->
    <div class="add-form">

      <!-- Dataset -->
      <mat-form-field appearance="outline" class="compact">
        <mat-select
          placeholder="Dataset"
          [(ngModel)]="draftDatasetId"
          (selectionChange)="onDatasetChange()">
          <mat-option *ngFor="let ds of datasets" [value]="ds.id">
            {{ ds.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Column -->
      <mat-form-field appearance="outline" class="compact">
        <mat-select
          placeholder="Column"
          [(ngModel)]="draftColumn"
          [disabled]="!draftDatasetId">
          <mat-option *ngFor="let c of availableColumns" [value]="c.name">
            {{ c.name }}
            <small class="col-type">({{ c.type }})</small>
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Operator -->
      <mat-form-field appearance="outline" class="compact op-field">
        <mat-select placeholder="Op" [(ngModel)]="draftOperator">
          <mat-option *ngFor="let op of operators" [value]="op.value">
            {{ op.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Value -->
      <mat-form-field appearance="outline" class="compact">
        <input
          matInput
          [(ngModel)]="draftValue"
          [placeholder]="valuePlaceholder" />
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        class="add-btn"
        [disabled]="!canAdd"
        (click)="add()">
        Add
      </button>
    </div>

    <div class="no-datasets" *ngIf="datasets.length === 0">
      No datasets available. The dashboard's model may still be loading.
    </div>
  </div>
</div>
