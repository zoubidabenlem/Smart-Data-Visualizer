<ng-container *ngIf="!loading; else loadingTpl">

  <div *ngIf="errorMessage" class="viewer-error">
    <mat-icon>error_outline</mat-icon>
    <p>{{ errorMessage }}</p>
  </div>

  <div *ngIf="dashboard && !errorMessage" class="viewer-container">

    <div class="viewer-topbar">
      <div class="viewer-title">
        <mat-icon>dashboard</mat-icon>
        <h1>{{ dashboard.title }}</h1>
      </div>

      <app-viewer-filter-chip
        [filters]="viewerFilters"
        [open]="filtersOpen"
        (filtersChange)="onFiltersChange($event)"
        (openChange)="onFiltersOpenChange($event)">
      </app-viewer-filter-chip>
    </div>

    <div class="viewer-page-tabs" *ngIf="pages.length > 1">
      <button
        *ngFor="let page of pages; trackBy: trackByPageId"
        class="page-tab"
        [class.active]="page.id === activePageId"
        (click)="selectPage(page.id)">
        {{ page.title }}
      </button>
    </div>

    <mat-progress-bar
      *ngIf="isRefreshing"
      mode="indeterminate"
      class="refresh-bar">
    </mat-progress-bar>

    <div class="viewer-canvas">
      <div class="viewer-empty" *ngIf="items.length === 0">
        <mat-icon>dashboard_customize</mat-icon>
        <p>This page has no widgets.</p>
      </div>

      <gridster [options]="options" class="viewer-gridster">
        <gridster-item
          *ngFor="let item of items; trackBy: trackByItemId"
          [item]="item"
          class="viewer-tile">

          <div class="viewer-tile-header">
            <span class="viewer-tile-title">
              {{ widgetOf(item)?.config?.title || 'Untitled' }}
            </span>
          </div>

          <div class="viewer-tile-body">
            <app-widget-chart
              *ngIf="widgetOf(item) as w"
              [widget]="w">
            </app-widget-chart>
          </div>
        </gridster-item>
      </gridster>
    </div>
  </div>
</ng-container>

<ng-template #loadingTpl>
  <div class="viewer-loading">
    <mat-spinner diameter="42"></mat-spinner>
  </div>
</ng-template>
