<div class="editor-container">
  <!-- Top banner (optional, already exists) -->
  <div class="top-banner">
    <div class="dashboard-title">
  <ng-container *ngIf="!isRenaming; else renameInput">
    <h2 (click)="enableRename()" title="Click to rename">
      {{ dashboard?.title || 'Untitled Dashboard' }}
      <mat-icon class="edit-icon">edit</mat-icon>
    </h2>
  </ng-container>
  <ng-template #renameInput>
    <input
      matInput
      [(ngModel)]="renameTitle"
      (keyup.enter)="saveRename()"
      (blur)="saveRename()"
      (keyup.escape)="cancelRename()"
      autofocus
    />
    <button mat-icon-button (click)="saveRename()">
      <mat-icon>check</mat-icon>
    </button>
    <button mat-icon-button (click)="cancelRename()">
      <mat-icon>close</mat-icon>
    </button>
  </ng-template>
</div>
    <div class="actions">
      <!-- Save, preview, etc. -->
    </div>
  </div>

  <!-- Main three-pane area -->
  <div class="main-area">
    <!-- Left pane toggle button (outside the pane) -->
    <button class="toggle-left" (click)="toggleLeft()" [class.collapsed]="leftCollapsed"
            aria-label="Toggle left panel">
      <mat-icon>{{ leftCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>

        <!-- Left pane: two independent chips -->
    <div class="left-pane" [class.collapsed]="leftCollapsed">
      <div class="left-pane-content">
        <app-model-picker
          [boundModelId]="dashboard?.model_id ?? null"
          [currentModel]="selectedModel"
          (modelSelected)="onModelSelected($event)">
        </app-model-picker>

        <app-model-metadata
          [model]="selectedModel">
        </app-model-metadata>
      </div>
    </div>

    <!-- Center pane (canvas) -->
    <div class="center-pane">
      <div class="canvas-wrapper">
        <app-center-canvas></app-center-canvas>
      </div>
    </div>

    <!-- Right pane -->
    <div class="right-pane" [class.collapsed]="rightCollapsed">
      <!-- When collapsed, show vertical strip with title and expand button -->
      <div class="right-collapsed-strip" *ngIf="rightCollapsed">
        <span class="vertical-title">Widget Configuration</span>
        <button class="toggle-right" (click)="toggleRight()" aria-label="Expand right panel">
          <mat-icon>chevron_left</mat-icon>
        </button>
      </div>

      <!-- When expanded, show full panel -->
      <div class="right-expanded" *ngIf="!rightCollapsed">
        <div class="right-panel-header">
          <span class="panel-title">Widget Configuration</span>
          <div class="header-actions">
            <button mat-stroked-button color="primary" (click)="addNewWidget()">
              <mat-icon>add</mat-icon> New Widget
            </button>
            <button class="toggle-right" (click)="toggleRight()" aria-label="Collapse right panel">
              <mat-icon>chevron_right</mat-icon>
            </button>
          </div>
        </div>
        <app-widget-config-panel></app-widget-config-panel>
      </div>
    </div>
  </div>
</div>
