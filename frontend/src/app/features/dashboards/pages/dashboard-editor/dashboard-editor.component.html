<div class="editor-container">
  <!-- Top banner (optional, already exists) -->
   <div class="top-banner">
    <div class="banner-left">
      <mat-icon class="banner-icon">dashboard</mat-icon>
      <div class="title-wrap">
        <ng-container *ngIf="!isRenaming; else renameInput">
          <h1 class="dashboard-title" (click)="enableRename()" title="Click to rename">
            {{ dashboard?.title || 'Untitled Dashboard' }}
          </h1>
          <span class="edit-hint">click to rename</span>
        </ng-container>
        <ng-template #renameInput>
          <input
            class="dashboard-title-input"
            [(ngModel)]="renameTitle"
            (keyup.enter)="saveRename()"
            (blur)="saveRename()"
            (keyup.escape)="cancelRename()"
            autofocus />
        </ng-template>
      </div>
    </div>

    <div class="banner-right">
      <span class="dirty-indicator" *ngIf="dashboardDirty">Unsaved changes</span>
      <span class="saved-indicator" *ngIf="!dashboardDirty">All changes saved</span>
    </div>
  </div>

  <!-- Main three-pane area -->
  <div class="main-area">

        <!-- Left pane: Model Tools -->
    <div class="left-pane" [class.collapsed]="leftCollapsed">

      <!-- Collapsed strip -->
      <div
        class="left-collapsed-strip"
        *ngIf="leftCollapsed"
        (click)="toggleLeft()">
        
        <div class="strip-title">Model Tools</div>
      </div>

      <!-- Expanded content -->
      <div class="left-pane-content" *ngIf="!leftCollapsed">
        <div class="pane-header">
          <button class="header-toggle" (click)="toggleLeft()" aria-label="Collapse Model Tools">
            <mat-icon>chevron_left</mat-icon>
          </button>
          <span class="panel-title">Model Tools</span>
        </div>

        <app-model-picker
          [boundModelId]="dashboard?.model_id ?? null"
          [currentModel]="selectedModel"
          (modelSelected)="onModelSelected($event)">
        </app-model-picker>

        <app-model-metadata
          [model]="selectedModel">
        </app-model-metadata>
      </div>
    </div>

    <!-- Center pane (canvas) -->
    <div class="center-pane">
      <div class="canvas-wrapper">
        <app-center-canvas></app-center-canvas>
      </div>
    </div>
    <!-- Right pane -->
        <!-- Right pane: Widget Tools -->
    <div class="right-pane" [class.collapsed]="rightCollapsed">

      <!-- Collapsed strip -->
      <div
        class="right-collapsed-strip"
        *ngIf="rightCollapsed"
        (click)="toggleRight()">
        <button class="strip-toggle" aria-label="Expand Widget Tools">
          <mat-icon>chevron_left</mat-icon>
        </button>
        <div class="strip-title">Widget Tools</div>
      </div>

      <!-- Expanded content -->
      <div class="right-expanded" *ngIf="!rightCollapsed">

        <div class="pane-header">
          <button class="header-toggle" (click)="toggleRight()" aria-label="Collapse Widget Tools">
            <mat-icon>chevron_right</mat-icon>
          </button>
          <span class="panel-title">Widget Tools</span>
          <span class="header-spacer"></span>
          <button mat-stroked-button color="primary" class="new-widget-btn" (click)="addNewWidget()">
            <mat-icon>add</mat-icon> New
          </button>
        </div>

        <div class="chips-scroll">

          <!-- Chip 1: Widget Details (list) -->
          <app-widget-list
            [widgets]="activePageWidgets"
            [selectedWidgetId]="selectedWidgetId"
            (widgetPicked)="onWidgetPicked($event)">
          </app-widget-list>

          <!-- Chip 2: Widget Config -->
          <div class="chip">
            <div class="chip-header" (click)="configCollapsed = !configCollapsed">
              <mat-icon class="chip-icon">tune</mat-icon>
              <span class="chip-title">Widget Config</span>
              <span class="chip-spacer"></span>
              <mat-icon class="chip-chevron">
                {{ configCollapsed ? 'expand_more' : 'expand_less' }}
              </mat-icon>
            </div>
            <div class="chip-body" *ngIf="!configCollapsed">
              <app-widget-config-panel></app-widget-config-panel>
            </div>
          </div>

        </div>
      </div>
    </div>

    
  </div>
    <div class="editor-footer">
    <span class="footer-hint" *ngIf="dashboardDirty">
      <mat-icon>info</mat-icon> You have unsaved changes.
    </span>
    <span class="footer-hint" *ngIf="!dashboardDirty">
      <mat-icon>check_circle</mat-icon> Everything is saved.
    </span>

    <span class="footer-spacer"></span>

    <button mat-stroked-button class="footer-btn" (click)="onDiscardOrRevert()">
      <mat-icon>restart_alt</mat-icon> Revert
    </button>
    <button
      mat-flat-button
      color="primary"
      class="footer-btn primary"
      [disabled]="!dashboardDirty || isSavingDashboard"
      (click)="onSaveDashboard()">
      <mat-icon *ngIf="!isSavingDashboard">save</mat-icon>
      <mat-spinner *ngIf="isSavingDashboard" diameter="14" class="inline-spinner"></mat-spinner>
      {{ isSavingDashboard ? 'Saving…' : 'Save Dashboard' }}
    </button>
  </div>
