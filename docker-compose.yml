services:
  mysql:
    image: mysql:8
    container_name: smartdata-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
  flyway:
    image: flyway/flyway:9
    container_name: smartdata-flyway
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - FLYWAY_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
      - FLYWAY_USER=${MYSQL_USER}
      - FLYWAY_PASSWORD=${MYSQL_PASSWORD}
      - FLYWAY_CONNECT_RETRIES=10
      - FLYWAY_BASELINE_ON_MIGRATE=true
      - FLYWAY_BASELINE_VERSION=0
    command: migrate
    volumes:
      - ./backend/app/db/migrations:/flyway/sql
    restart: on-failure

    
  api:
    build: ./backend                # Dockerfile req
    container_name: smartdata-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend               # Dockerfile created(2 phases)
    container_name: smartdata-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mysql_data:
